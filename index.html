function norm(s){return(" "+String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim()+" ")}
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let d=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){let pr=d[0];d[0]=i;for(let j=1;j<=n;j++){const tmp=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,pr+(a[i-1]===b[j-1]?0:1));pr=tmp}}return d[n]}
function matchKing(input){
 const s=norm(input);if(s.trim()==="")return null;let best=null,bl=0;
 for(const k of KINGS)for(const a of k.al){const an=norm(a);if(s.includes(an)&&an.length>bl){best=k.id;bl=an.length}}
 if(best)return best;
 const st=s.trim();let bd=9;for(const k of KINGS)for(const a of k.al){const an=norm(a).trim();if(an.length<5)continue;const d=lev(st,an);const tol=an.length>=9?2:1;if(d<=tol&&d<bd){bd=d;best=k.id}}
 return best;
}
